            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .progress-stat {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        .progress-container {
            background: #F1F5F9;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            background: var(--card-bg);
        }

        .search-box {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }

        .filter-scroll-group {

            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-scroll-group::-webkit-scrollbar {

        .pill-btn {

            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .pill-btn.active {
            background: var(--text-main);
            color: white;
            border-color: var(--text-main);
        }

        .restaurant-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 30px;
        }

        .restaurant-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);

        .restaurant-card.visited {

            opacity: 0.6;
        }

        .restaurant-card.visited .res-name {
            text-decoration: line-through;
            color: #94A3B8;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-container input {
            display: none;
        }

        .checkmark {
            width: 26px;
            height: 26px;
            border: 2px solid #CBD5E1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: var(--success);
            border-color: var(--success);
        }

        .checkmark::after {
            content: "";
            display: none;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        .checkbox-container input:checked ~ .checkmark::after {
            display: block;
        }

        .res-info {
            flex: 1;
            min-width: 0;
        }

        .res-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;

        .res-meta {
            font-size: 12px;
            color: var(--text-secondary);

        .badge {

</head>

            } catch (e) {}
            render();
        }

            const item = restaurants.find(r => r.id === id);
            if (item) {
                item.visited = !item.visited;
                saveData();
            }
        }

            currentStatus = status;
            btn.parentElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

            currentCuisine = cuisine;
            btn.parentElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

            return 'https://www.openrice.com/zh/hongkong/restaurants?where=' + encodeURIComponent('荔枝角 ' + name);

            const listEl = document.getElementById('restaurantList');

                const matchesSearch = !searchVal || 
                                      r.name.toLowerCase().includes(searchVal) || 
                                      r.cuisine.toLowerCase().includes(searchVal) || 
                                      r.building.toLowerCase().includes(searchVal);

                                     currentStatus === 'visited' ? r.visited : !r.visited;

                return matchesSearch && matchesStatus && matchesCuisine;

            if (visitedNumEl) visitedNumEl.innerText = visitedCount;

            const totalNumEl = document.getElementById('totalNum');
            if (totalNumEl) totalNumEl.innerText = total;

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="empty-state">搵唔到符合條件嘅餐廳 🍽️</div>';
                return;
            }

            let htmlStr = '';
            for (let i = 0; i < filtered.length; i++) {
                const r = filtered[i];
                htmlStr += '<div class="restaurant-card ' + (r.visited ? 'visited' : '') + '" onclick="toggleVisited(' + r.id + ')">';
                htmlStr += '  <label class="checkbox-container" onclick="event.stopPropagation()">';
                htmlStr += '    <input type="checkbox" ' + (r.visited ? 'checked' : '') + ' onchange="toggleVisited(' + r.id + ')">';
                htmlStr += '    <span class="checkmark"></span>';
                htmlStr += '  </label>';
                htmlStr += '  <div class="res-info">';
                htmlStr += '    <div class="res-name">' + r.name + '</div>';
                htmlStr += '    <div class="res-meta">';
                htmlStr += '      <span class="badge badge-cuisine">' + r.cuisine + '</span>';
                htmlStr += '      <span class="badge badge-building">' + r.building + '</span>';
                htmlStr += '    </div>';
                htmlStr += '  </div>';
                htmlStr += '  <a href="' + getOpenRiceUrl(r.name) + '" target="_blank" class="openrice-btn" onclick="event.stopPropagation()">OpenRice ↗</a>';
                htmlStr += '</div>';
            }

            listEl.innerHTML = htmlStr;
        }

        // 初始化第一次渲染
        render();
    </script>
</body>
</html>
